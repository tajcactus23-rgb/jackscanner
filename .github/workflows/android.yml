name: Build Android APK

on:
  push:
    branches: [master, test, feature/*]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Install Gradle
      run: |
        cd $HOME
        curl -sL https://services.gradle.org/distributions/gradle-8.2-bin.zip -o gradle.zip
        unzip -q gradle.zip
        export PATH=$HOME/gradle-8.2/bin:$PATH
        gradle --version

    - name: Setup Android SDK
      uses: android-actions/setup-android@v2

    - name: Build JackScanner APK
      run: |
        export PATH=$HOME/gradle-8.2/bin:$PATH
        export ANDROID_HOME=$HOME/android-sdk
        echo "sdk.dir=$ANDROID_HOME" > jackscanner/local.properties
        cd jackscanner
        gradle assembleDebug --no-daemon

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: jackscanner-apk
        path: jackscanner/app/build/outputs/apk/debug/*.apk
